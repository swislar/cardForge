<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 260" width="100%" height="100%">
  <defs>
    <linearGradient id="avatarGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4a5568" />
      <stop offset="100%" stop-color="#2d3748" />
    </linearGradient>
  </defs>
  <rect x="6" y="6" width="288" height="248" rx="14" fill="#141824" stroke="#333d4e" stroke-width="2" stroke-dasharray="6 4" />
  <g transform="translate(150, 105)">
    <!-- Head -->
    <circle cx="0" cy="-24" r="28" fill="url(#avatarGrad)" />
    <!-- Body/Shoulders -->
    <path d="M -44,38 C -44,10 -24,4 0,4 C 24,4 44,10 44,38 Z" fill="url(#avatarGrad)" />
    <!-- Camera/Add Badge -->
    <circle cx="26" cy="18" r="14" fill="#3b82f6" />
    <path d="M 21,18 L 31,18 M 26,13 L 26,23" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" />
  </g>
  <text x="150" y="195" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" fill="#8892b0" letter-spacing="0.5">Click to add photo</text>
  <text x="150" y="215" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#4a5568">JPG, PNG or WebP</text>
</svg>
